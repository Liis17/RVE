[workspace]
members = ["engine/*", "tools/*", "editor"]
exclude = ["examples"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ash = "=0.38.0"
ash-window = "=0.13.0"
base64 = "=0.23.1"
blake3 = "=1.8.7"
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
cpal = "=0.18.2"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
egui = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "links"] }
egui_dock = "=0.21.1"
font8x8 = { version = "=0.3.1", default-features = false }
flume = { version = "=0.11.1", default-features = false, features = ["async", "select"] }
getrandom = "=0.4.3"
gilrs = "=0.11.2"
glam = "=0.34.1"
lz4_flex = "=0.14.0"
lewton = "=0.10.2"
libc = "=0.2.190"
libloading = "=0.9.0"
log = "=0.4.34"
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored"] }
# naga 30.0.1 не собирает glsl-in без wgsl-in или spv-in: модуль interpolator скрыт за ними.
naga = { version = "=30.0.1", features = ["glsl-in", "spv-out", "wgsl-in"] }
notify = { version = "=8.2.1", default-features = false, features = ["macos_fsevent"] }
rtrb = "=0.4.0"
objc2-app-kit = { version = "=0.2.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGSession"] }
objc2-foundation = { version = "=0.2.2", default-features = false, features = ["std", "NSThread"] }
png = "=0.18.1"
raw-window-handle = "=0.6.2"
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
toml = "=0.8.23"
tiny_http = "=0.12.0"
ufbx = "=0.11.5"
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winit = "=0.30.13"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
zeroize = "=1.9.1"
zstd = "=0.14.2"

# Без оптимизаций кадр редактора в dev-сборке в десятки раз медленнее release.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
