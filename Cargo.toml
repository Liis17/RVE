[workspace]
members = ["engine/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ash = "=0.38.0"
ash-window = "=0.13.0"
glam = "=0.34.1"
# naga 30.0.1 не собирает glsl-in без wgsl-in или spv-in: модуль interpolator скрыт за ними.
naga = { version = "=30.0.1", features = ["glsl-in", "spv-out", "wgsl-in"] }
raw-window-handle = "=0.6.2"
winit = "=0.30.13"
