[workspace]
members = ["engine/*", "tools/*", "editor"]
exclude = ["examples"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ash = "=0.38.0"
ash-window = "=0.13.0"
blake3 = "=1.8.7"
egui = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "links"] }
egui_dock = "=0.21.1"
font8x8 = { version = "=0.3.1", default-features = false }
flume = { version = "=0.11.1", default-features = false, features = ["async", "select"] }
glam = "=0.34.1"
lz4_flex = "=0.14.0"
libc = "=0.2.190"
libloading = "=0.9.0"
log = "=0.4.34"
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored"] }
# naga 30.0.1 не собирает glsl-in без wgsl-in или spv-in: модуль interpolator скрыт за ними.
naga = { version = "=30.0.1", features = ["glsl-in", "spv-out", "wgsl-in"] }
objc2-app-kit = { version = "=0.2.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSResponder"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["CGSession"] }
objc2-foundation = { version = "=0.2.2", default-features = false, features = ["std", "NSThread"] }
png = "=0.18.1"
raw-window-handle = "=0.6.2"
rfd = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
toml = "=0.8.23"
ufbx = "=0.11.5"
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winit = "=0.30.13"
zstd = "=0.14.2"
