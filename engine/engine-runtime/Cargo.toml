[package]
name = "engine-runtime"
version = "0.14.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
dev-console = ["dep:egui", "dep:egui-winit", "dep:engine-ui", "dep:winit"]
dlss = ["engine-render/dlss"]

[dependencies]
engine-core = { path = "../engine-core" }
engine-console = { path = "../engine-console" }
engine-input = { path = "../engine-input" }
egui = { workspace = true, optional = true }
egui-winit = { workspace = true, optional = true }
engine-assets = { path = "../engine-assets" }
engine-ui = { path = "../engine-ui", optional = true }
engine-files = { path = "../engine-files" }
engine-audio = { path = "../engine-audio" }
engine-animation = { path = "../engine-animation" }
engine-neural = { path = "../engine-neural" }
engine-network = { path = "../engine-network" }
engine-physics = { path = "../engine-physics" }
engine-platform = { path = "../engine-platform" }
engine-project = { path = "../engine-project" }
engine-render = { path = "../engine-render" }
engine-resources = { path = "../engine-resources" }
engine-scene = { path = "../engine-scene" }
engine-script = { path = "../engine-script" }
engine-window = { path = "../engine-window" }
flume.workspace = true
glam.workspace = true
log.workspace = true
sysinfo.workspace = true
winit = { workspace = true, optional = true }

[dev-dependencies]
rve-sdk = { path = "../rve-sdk" }
