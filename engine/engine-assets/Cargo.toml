[package]
name = "engine-assets"
version = "0.6.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["fbx"]
fbx = ["dep:bevy_mikktspace", "dep:ufbx"]

[dependencies]
bevy_mikktspace = { workspace = true, optional = true }
engine-resources = { path = "../engine-resources" }
png.workspace = true
ufbx = { workspace = true, optional = true }

[dev-dependencies]
engine-files = { path = "../engine-files" }
engine-pak = { path = "../engine-pak" }

[[test]]
name = "demo_worm"
path = "tests/demo_worm.rs"
required-features = ["fbx"]

[[test]]
name = "skinned_fbx"
path = "tests/skinned_fbx.rs"
required-features = ["fbx"]
