[package]
name = "rve-server"
version = "0.3.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rve-server"
path = "src/main.rs"

[dependencies]
engine-runtime = { path = "../engine-runtime" }

[features]
default = ["crash-dumps"]
crash-dumps = ["engine-runtime/crash-dumps"]
