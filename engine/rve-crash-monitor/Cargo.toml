[package]
name = "rve-crash-monitor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# `server` собирает сам монитор (minidumper и платформенные API). Без него остаётся библиотека
# с именами и хранением файлов `crash-*`, которую использует engine-runtime.
[features]
default = ["server"]
server = ["dep:minidumper", "dep:windows-sys", "dep:libc"]

[[bin]]
name = "rve-crash-monitor"
path = "src/main.rs"
required-features = ["server"]

[[test]]
name = "dump_on_request"
required-features = ["server"]

[[test]]
name = "early_connection"
required-features = ["server"]

[[test]]
name = "lifecycle"
required-features = ["server"]

[target.'cfg(any(all(windows, target_arch = "x86_64"), target_os = "macos"))'.dependencies]
minidumper = { workspace = true, optional = true }

[target.'cfg(any(all(windows, target_arch = "x86_64"), target_os = "macos"))'.dev-dependencies]
crash-handler.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true, optional = true }
