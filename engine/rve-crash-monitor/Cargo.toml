[package]
name = "rve-crash-monitor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rve-crash-monitor"
path = "src/main.rs"

[target.'cfg(any(all(windows, target_arch = "x86_64"), target_os = "macos"))'.dependencies]
minidumper.workspace = true

[target.'cfg(any(all(windows, target_arch = "x86_64"), target_os = "macos"))'.dev-dependencies]
crash-handler.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
