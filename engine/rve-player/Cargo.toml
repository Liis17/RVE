[package]
name = "rve-player"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "rve-player"
path = "src/main.rs"

[dependencies]
engine-runtime = { path = "../engine-runtime" }

[features]
default = ["dev-console", "crash-dumps"]
dev-console = ["engine-runtime/dev-console"]
dlss = ["engine-runtime/dlss"]
crash-dumps = ["engine-runtime/crash-dumps"]
