<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="RVE Mesh — Unity-inspired grid">
  <!-- Original vector design inspired by the flat grid language of Unity's Mesh icon. -->
  <defs>
    <linearGradient id="gridColor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#91E8FF"/>
      <stop offset="1" stop-color="#55C3ED"/>
    </linearGradient>
  </defs>
  <!-- Flat nine-cell mesh grid: no 3D cube, nodes or heavy shading -->
  <rect x="12.2" y="12.2" width="39.6" height="39.6" rx="2.4" fill="#56C7EB" fill-opacity=".10" stroke="url(#gridColor)" stroke-width="3.2"/>
  <path d="M25.4 13.8V50.2 M38.6 13.8V50.2 M13.8 25.4H50.2 M13.8 38.6H50.2" fill="none" stroke="url(#gridColor)" stroke-width="3.0" stroke-linecap="butt"/>
</svg>
