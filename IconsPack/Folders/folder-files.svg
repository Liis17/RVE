<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Folder with files">
  <defs>
    <linearGradient id="folderBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFBD39"/>
      <stop offset="1" stop-color="#FF9C25"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE079"/>
      <stop offset="1" stop-color="#FFCC52"/>
    </linearGradient>
    <linearGradient id="folderFrontRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD35C"/>
      <stop offset="1" stop-color="#FFC744"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9E8"/>
      <stop offset="1" stop-color="#FFE6B9"/>
    </linearGradient>
    <linearGradient id="bluePaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4F7FF"/>
      <stop offset="1" stop-color="#AFE3F7"/>
    </linearGradient>
    <clipPath id="folderFace"><path d="M7 29 Q7 24 12 24 H52 Q57 24 57 29 V48 Q57 54 51 54 H13 Q7 54 7 48 Z"/></clipPath>
  </defs>
  <!-- Back of the folder, including its tab and orange opening -->
  <path d="M7 20 Q7 15 12 15 H23.5 Q26 15 27.8 17.6 L31 21 H51 Q57 21 57 27 V47 H7 Z" fill="url(#folderBack)"/>
  <path d="M9 24 H55 V30 H9 Z" fill="#EFA024" opacity="0.27"/>
  
  <!-- Neutral, unlabeled file silhouettes: no text, file-type symbols or media cues -->
  <g transform="rotate(-9 26 25)">
    <rect x="18" y="12" width="19" height="26" rx="3" fill="#D8DEE5"/>
    <path d="M20.5 14.5 H34.5" stroke="#FFFFFF" stroke-width="1.2" opacity="0.34"/>
  </g>
  <g transform="rotate(8 38 25)">
    <rect x="30" y="11" width="18" height="27" rx="3" fill="#F6F7F9"/>
    <path d="M32.5 13.5 H45.5" stroke="#FFFFFF" stroke-width="1.2" opacity="0.55"/>
  </g>
  <!-- Front pocket -->
  <path d="M7 29 Q7 24 12 24 H52 Q57 24 57 29 V48 Q57 54 51 54 H13 Q7 54 7 48 Z" fill="url(#folderFront)"/>
  <g clip-path="url(#folderFace)"><path d="M33 24 H59 V55 H33 Z" fill="url(#folderFrontRight)" opacity="0.40"/></g>
</svg>