[package]
name = "rve-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rve-editor"
path = "src/main.rs"

[dependencies]
egui.workspace = true
egui-winit.workspace = true
egui_dock = { workspace = true, features = ["serde"] }
winit.workspace = true
engine-console = { path = "../engine/engine-console" }
engine-assets = { path = "../engine/engine-assets" }
engine-files = { path = "../engine/engine-files" }
engine-ui = { path = "../engine/engine-ui" }
engine-project = { path = "../engine/engine-project" }
engine-render = { path = "../engine/engine-render" }
engine-resources = { path = "../engine/engine-resources" }
engine-scene = { path = "../engine/engine-scene" }
engine-script = { path = "../engine/engine-script" }
engine-window = { path = "../engine/engine-window" }
glam.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rve-sdk = { path = "../engine/rve-sdk" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
