name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.packages.outputs.has_changes }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Check out repository and comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test package selection
        run: python3 -B -m unittest discover -s .github/scripts -v
      - name: Create build directory
        run: mkdir -p build
      - name: Select packages
        id: packages
        working-directory: build
        run: python3 -B ../.github/scripts/affected_packages.py

  checks:
    name: Checks (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.has_changes == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_PACKAGES: ${{ needs.changes.outputs.packages }}
      BUILD_DEMO_GAME: ${{ contains(needs.changes.outputs.packages, 'rve-build') || contains(needs.changes.outputs.packages, 'engine-runtime') || contains(needs.changes.outputs.packages, 'rve-player') || contains(needs.changes.outputs.packages, 'engine-script') || contains(needs.changes.outputs.packages, 'rve-sdk') }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Create build directory
        shell: bash
        run: mkdir -p build
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select Rust stable
        run: rustup default stable
      - name: Check formatting
        working-directory: build
        run: |
          read -r -a packages <<< "$CARGO_PACKAGES"
          cargo fmt "${packages[@]}" --check
      - name: Clippy
        working-directory: build
        run: |
          read -r -a packages <<< "$CARGO_PACKAGES"
          cargo clippy "${packages[@]}" --all-targets --locked -- -D warnings
      - name: Build affected packages
        working-directory: build
        run: |
          read -r -a packages <<< "$CARGO_PACKAGES"
          cargo build "${packages[@]}" --locked
      - name: Test affected packages
        working-directory: build
        run: |
          read -r -a packages <<< "$CARGO_PACKAGES"
          cargo test "${packages[@]}" --locked
      - name: Install Vulkan runtime for demo build
        if: ${{ runner.os == 'macOS' && env.BUILD_DEMO_GAME == 'true' }}
        run: brew install vulkan-loader molten-vk
      - name: Build demo game
        if: ${{ env.BUILD_DEMO_GAME == 'true' }}
        working-directory: build
        run: cargo run -p rve-build --locked -- build ../examples/demo-game --output demo-out
      - name: Check rve-build checkout cache and SDK isolation
        if: ${{ env.BUILD_DEMO_GAME == 'true' }}
        working-directory: build
        env:
          PYTHONUTF8: "1"
        run: python -B ../.github/scripts/check_rve_build_sdk.py
      - name: Check Windows GUI-player argument diagnostics
        if: ${{ runner.os == 'Windows' && env.BUILD_DEMO_GAME == 'true' }}
        shell: pwsh
        working-directory: build
        run: |
          $player = Join-Path $PWD 'player\release\rve-player.exe'
          $stderrPath = Join-Path $env:RUNNER_TEMP ("rve-player-stderr-" + [guid]::NewGuid().ToString("N") + ".txt")
          try {
            $process = Start-Process -FilePath $player -ArgumentList @('--bogus') -RedirectStandardError $stderrPath -Wait -PassThru -NoNewWindow
            $stderr = Get-Content -Raw $stderrPath
            if ($process.ExitCode -ne 2) { throw "expected exit code 2, got $($process.ExitCode); stderr: $stderr" }
            if (-not $stderr.Contains('Ошибка аргументов')) { throw "argument error missing from stderr: $stderr" }
          } finally {
            Remove-Item -LiteralPath $stderrPath -ErrorAction SilentlyContinue
          }

  ci:
    name: CI
    if: ${{ always() }}
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selection and all necessary checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HAS_CHANGES: ${{ needs.changes.outputs.has_changes }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$HAS_CHANGES" = "true" ]; then
            test "$CHECKS_RESULT" = "success"
          else
            test "$HAS_CHANGES" = "false"
            test "$CHECKS_RESULT" = "skipped"
          fi
