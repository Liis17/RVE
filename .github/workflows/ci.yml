name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_changes: ${{ steps.packages.outputs.has_changes }}
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - name: Check out repository and comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Test package selection
        run: python3 -B -m unittest discover -s .github/scripts -v
      - name: Create build directory
        run: mkdir -p build
      - name: Select packages
        id: packages
        working-directory: build
        run: python3 -B ../.github/scripts/affected_packages.py

  checks:
    name: Checks (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.has_changes == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_PACKAGES: ${{ needs.changes.outputs.packages }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Create build directory
        shell: bash
        run: mkdir -p build
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select Rust stable
        run: rustup default stable
      - name: Check formatting
        working-directory: build
        run: |
          read -r -a packages <<< "$CARGO_PACKAGES"
          cargo fmt "${packages[@]}" --check
      - name: Clippy
        working-directory: build
        run: |
          read -r -a packages <<< "$CARGO_PACKAGES"
          cargo clippy "${packages[@]}" --all-targets --locked -- -D warnings
      - name: Build affected packages
        working-directory: build
        run: |
          read -r -a packages <<< "$CARGO_PACKAGES"
          cargo build "${packages[@]}" --locked
      - name: Test affected packages
        working-directory: build
        run: |
          read -r -a packages <<< "$CARGO_PACKAGES"
          cargo test "${packages[@]}" --locked
      - name: Install Vulkan runtime for demo build
        if: ${{ runner.os == 'macOS' && (contains(needs.changes.outputs.packages, 'rve-build') || contains(needs.changes.outputs.packages, 'engine-runtime')) }}
        run: brew install vulkan-loader molten-vk
      - name: Build demo game
        if: ${{ contains(needs.changes.outputs.packages, 'rve-build') || contains(needs.changes.outputs.packages, 'engine-runtime') }}
        working-directory: build
        run: cargo run -p rve-build --locked -- build ../examples/demo-game --output demo-out

  ci:
    name: CI
    if: ${{ always() }}
    needs: [changes, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selection and all necessary checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          HAS_CHANGES: ${{ needs.changes.outputs.has_changes }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [ "$HAS_CHANGES" = "true" ]; then
            test "$CHECKS_RESULT" = "success"
          else
            test "$HAS_CHANGES" = "false"
            test "$CHECKS_RESULT" = "skipped"
          fi
