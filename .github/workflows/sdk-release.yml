name: SDK Release

on:
  push:
    branches: [mommy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Select SDK changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_sdk: ${{ steps.select.outputs.build_sdk }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release scripts
        run: python3 -B -m unittest discover -s .github/scripts -v
      - name: Select affected SDK components
        id: select
        run: |
          mkdir -p build
          python3 -B .github/scripts/select_sdk_release.py

  release:
    name: Build and publish Windows x64 SDK
    needs: changes
    if: ${{ needs.changes.outputs.build_sdk == 'true' && github.ref == 'refs/heads/mommy' }}
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    concurrency:
      group: sdk-release-${{ github.sha }}
      cancel-in-progress: false
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
        working-directory: build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Create build directory
        working-directory: .
        run: New-Item -ItemType Directory -Force build
      - name: Install host and bundled Rust toolchains
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable-x86_64-pc-windows-msvc
      - name: Build full SDK with bundled GNU toolchain
        run: |
          $toolchain = rustup run stable-x86_64-pc-windows-gnu rustc --print sysroot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --release -p rve-build --locked -- sdk --output sdk-verified --rust-toolchain $toolchain
      - name: Archive and verify SDK without system Rust
        run: python -B ../.github/scripts/package_sdk_release.py sdk-verified sdk-verified.zip
      - name: Publish verified ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $tag = "sdk-$env:RELEASE_SHA"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag sdk-verified.zip --clobber
          } else {
            gh release create $tag sdk-verified.zip --target $env:RELEASE_SHA --title "RVE SDK Windows x64 ($($env:RELEASE_SHA.Substring(0, 12)))" --prerelease --latest=false --notes "Autonomous Windows x64 editor, players, guest SDK and Rust GNU toolchain. Scripts and Build Player verified with system-only PATH. Commit: $env:RELEASE_SHA"
          }
