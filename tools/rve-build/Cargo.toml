[package]
name = "rve-build"
version = "0.14.0"
edition.workspace = true
license.workspace = true

[dependencies]
engine-assets = { path = "../../engine/engine-assets" }
engine-render = { path = "../../engine/engine-render" }
engine-files = { path = "../../engine/engine-files" }
engine-gui = { path = "../../engine/engine-gui" }
engine-pak = { path = "../../engine/engine-pak" }
engine-project = { path = "../../engine/engine-project" }
engine-resources = { path = "../../engine/engine-resources" }
engine-script = { path = "../../engine/engine-script" }
engine-scene = { path = "../../engine/engine-scene" }
libc.workspace = true
rve-sdk = { path = "../../engine/rve-sdk" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
